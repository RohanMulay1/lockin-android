name: keygen

# One-off: creates the permanent signing key. Download the artifact, set the
# LOCKIN_KEYSTORE_B64 and LOCKIN_KEYSTORE_PASSWORD secrets, then delete the artifact.
on: workflow_dispatch

jobs:
  keygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        run: |
          mkdir out
          PW=$(openssl rand -base64 48 | tr -d '/+=\n' | head -c 32)
          keytool -genkeypair -keystore out/lockin.jks -storetype PKCS12 -alias lockin \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=LockIn, O=Rohan Mulay, C=IN"
          printf '%s' "$PW" > out/password.txt
          base64 -w0 out/lockin.jks > out/lockin.jks.b64

      - uses: actions/upload-artifact@v4
        with:
          name: lockin-keystore
          path: out/
          retention-days: 1
