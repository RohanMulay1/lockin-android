name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.LOCKIN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lockin.jks"
            echo "LOCKIN_KEYSTORE_PATH=$RUNNER_TEMP/lockin.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::LOCKIN_KEYSTORE_B64 not set; APK uses a throwaway debug key and cannot update in place"
          fi

      - name: Unit tests and debug APK
        env:
          LOCKIN_KEYSTORE_PASSWORD: ${{ secrets.LOCKIN_KEYSTORE_PASSWORD }}
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Signing certificate fingerprint
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-256"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # The in-app updater reads releases/latest; tag v1.1.<run> matches the APK versionCode.
      - name: Publish release for in-app updates
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.1.${{ github.run_number }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LockIn.apk
          git log -1 --pretty=%B > notes.md
          gh release create "$TAG" LockIn.apk --title "LockIn $TAG" --notes-file notes.md --latest
